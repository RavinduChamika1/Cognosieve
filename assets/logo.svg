<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="CognoSieve - Web and LLM Vulnerability Assessment" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#101322"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
  </defs>
  <rect width="900" height="260" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="897" height="257" rx="22.5" fill="none" stroke="#242A47" stroke-width="3"/>

  <!-- Icon: a shield split between code-brackets (web) and a chat bubble (LLM), filtering through a sieve -->
  <g transform="translate(40,34)">
    <rect width="190" height="190" rx="44" fill="url(#tile)"/>
    <path d="M95 26 L156 46 V104 C156 142 130 164 95 176 C60 164 34 142 34 104 V46 Z" fill="#0B1220" opacity="0.88"/>
    <!-- left half: code brackets (web) -->
    <text x="62" y="108" font-family="'Consolas','Courier New',monospace" font-size="34" fill="#38BDF8" text-anchor="middle" font-weight="700">&lt;/&gt;</text>
    <!-- right half: chat bubble (LLM) -->
    <path d="M118 84 h26 a8 8 0 0 1 8 8 v16 a8 8 0 0 1 -8 8 h-14 l-8 9 v-9 h-4 a8 8 0 0 1 -8 -8 v-16 a8 8 0 0 1 8 -8 Z" fill="#A5B4FC"/>
    <!-- sieve line through the middle -->
    <line x1="95" y1="56" x2="95" y2="156" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 5" opacity="0.5"/>
    <!-- verified badge -->
    <circle cx="95" cy="150" r="18" fill="#16A34A" stroke="#0B1220" stroke-width="5"/>
    <path d="M87 150 L93 156 L104 143" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text x="262" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF">Cogno<tspan fill="#38BDF8">Sieve</tspan></text>
  <text x="264" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#9CA8C9">Web &amp; LLM Vulnerability Assessment</text>
  <rect x="264" y="178" width="64" height="5" rx="2.5" fill="#38BDF8"/>
  <text x="264" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#636F8C" letter-spacing="1">OWASP ZAP  ·  PROMPTFOO  ·  OWASP LLM TOP 10  ·  GEMINI AI  ·  WEEK 6</text>
</svg>
